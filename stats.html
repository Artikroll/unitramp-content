const PLAN={};
async function loadPlan(url){
 if(PLAN[url])return PLAN[url];
 PLAN[url]={panes:{}};
 try{const h=await fetch(url).then(r=>r.text());const d=new DOMParser().parseFromString(h,'text/html');

  d.querySelectorAll('section.pane').forEach(p=>{const m={};p.querySelectorAll('article').forEach(a=>{const id=a.querySelector('.id')?.textContent.trim();if(id&&!m[id])m[id]=a.innerHTML.replace(/<button onclick="cp\('([^']+)'/g,(x,i)=>`<button onclick="cp('${i}',this,1)"`).replace(/ id="(p\d+_\d+b)"/g,' data-cid="$1"');});PLAN[url].panes[p.dataset.p]=m;});
 }catch(e){}
 return PLAN[url];

 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok,()=>fb(t,ok))}else fb(t,ok)}

  h+=`<section><h2>По площадкам</h2><div class="tw"><table><tr><th>Площадка</th><th class="n">Публикаций</th><th class="n">Просмотры</th><th class="n">Взаимодействия</th><th>Больше всего</th></tr>`+
  plats.map(p=>{const b=by[p];return `<tr><td><a href="#" data-p="${p}">${p}</a></td><td class="n">${p=='Pinterest'?'60 пинов':b.n}</td><td class="n">${fmt(b.v)}</td><td class="n">${fmt(b.i)}</td><td>${p=='Pinterest'?'2 пина в день':b.best.t+', '+fmt(b.best.v)}</td></tr>`}).join('')+
  `<tr class="tot"><td>Итого</td><td class="n">${T.n} + 60 пинов</td><td class="n">${fmt(T.v)}</td><td class="n">${fmt(T.i)}</td><td></td></tr></table></div><p class="muted">${M.extra}</p></section>`;
  const rows=sorter(all.slice());
  h+=`<section><h2>Все публикации <span class="muted">· ${rows.length} · полный пост с текстом и медиа во вкладке площадки</span></h2><div class="list">`+
  rows.map(r=>`<div class="li"><span class="ld">${r.d||'—'}</span><span class="tag">${r.pl}</span><span class="lt">${r.t}</span><span class="lv">${fmt(r.v)} <small>просм.</small> · ${fmt(r.i)} <small>взаим.</small></span></div>`).join('')+
  `</div><p class="muted">Сортировка: <a href="#" data-s="v">по просмотрам</a> · <a href="#" data-s="i">по взаимодействиям</a> · <a href="#" data-s="d">по дате</a></p></section>`;
  h+=mgrBlock(M);
  h+=`<section><h2>Выводы месяца для следующего плана</h2><ul>${M.notes.map(n=>`<li>${n}</li>`).join('')}</ul></section>`;
  app.innerHTML=h;return;
 }
 const rows=sorter(all.filter(r=>r.pl==st.p));const b=agg(rows);
 let h=`<section><h2>${st.p} · ${M.label} <span class="muted">· ${M.period}</span></h2><div class="kpis">
 <div class="kpi"><b>${st.p=='Pinterest'?'60':b.n}</b><span>${st.p=='Pinterest'?'пинов':'публикаций'}</span></div><div class="kpi"><b>${fmt(b.v)}</b><span>просмотров</span></div><div class="kpi"><b>${fmt(b.i)}</b><span>взаимодействий</span></div>
 ${st.p=='Pinterest'?'':`<div class="kpi"><b>${fmt(Math.round(b.v/b.n))}</b><span>просмотров в среднем на публикацию</span></div>`}</div>
 ${st.p=='ВК'?`<p class="muted">${M.extra.split('. Подписчики')[0]}.</p>`:''}
 ${st.p=='Pinterest'?'<p class="muted">Пины ведутся по отдельному плану Pinterest, 2 в день в 11:00 и 19:30 МСК.</p>':`<p class="muted">Сортировка: <a href="#" data-s="v">по просмотрам</a> · <a href="#" data-s="i">по взаимодействиям</a> · <a href="#" data-s="d">по дате</a></p>`}</section>`;
 if(st.p!='Pinterest'){
  app.innerHTML=h+'<p class="muted">Загружаю посты…</p>';
  const plan=await loadPlan(M.plan);
  h+=rows.map((r,k)=>{const c=card(plan,r);return `<div class="post"><div class="pstat"><b>${k+1}.</b> ${r.d||'—'} · ${r.f} · <b>${fmt(r.v)}</b> просм. · <b>${fmt(r.i)}</b> взаим.</div>${c?`<article>${c}</article>`:`<article><header><span class="id">${r.id}</span><b>${r.t}</b></header><div class="meta">Поста нет в контент-плане (опубликован вне плана)</div></article>`}</div>`}).join('');
 }
 app.innerHTML=h;
}
document.addEventListener('click',e=>{const t=e.target.closest('[data-m],[data-p],[data-s]');if(!t)return;if(t.tagName=='A')e.preventDefault();
 if(t.dataset.m!=null)st.m=+t.dataset.m;else if(t.dataset.p)st.p=t.dataset.p;else st.sort=t.dataset.s;save();render();if(!t.dataset.s)scrollTo(0,0);});
render();
</script></body></html>
