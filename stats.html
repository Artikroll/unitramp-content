:root{--navy:#121B2B;--acc:#1F5EDB;--line:#E1E4EA;--muted:#667085;--bg:#F4F5F7;--good:#E8F5E9;--low:#FDECEC}*{box-sizing:border-box}
body{margin:0;font:15px/1.5 -apple-system,Arial,sans-serif;background:var(--bg);color:#1B2433}

.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.btn{border:1px solid #3A4760;background:transparent;color:#fff;border-radius:6px;padding:6px 12px;font:inherit;cursor:pointer}.btn.on{background:#fff;color:var(--navy)}
.sm{border:0;background:#2A3650;color:#fff;border-radius:5px;padding:3px 10px;font:inherit;font-size:13px;cursor:pointer}.sm.on{background:var(--acc)}
main{max-width:980px;margin:0 auto;padding:16px}section{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
h2{font-size:16px;margin:0 0 10px}.muted{color:var(--muted);font-size:13px}.note{background:#FFF8E1;border:1px solid #F5DE8A;border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.kpi{border:1px solid var(--line);border-radius:8px;padding:10px 12px}.kpi b{display:block;font-size:22px}.kpi span{font-size:12px;color:var(--muted)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}th{font-size:12px;color:var(--muted);font-weight:600;cursor:pointer;white-space:nowrap}td.n,th.n{text-align:right;white-space:nowrap}
tr.tot td{font-weight:700;border-top:2px solid var(--navy)}tr.top3 td{background:var(--good)}tr.bot3 td{background:var(--low)}.tag{display:inline-block;font-size:11px;border-radius:4px;padding:1px 6px;background:#EEF2FA;color:#344054;margin-right:4px}
ul{margin:0;padding-left:20px}li{margin-bottom:6px}

const PLATS=['Все','YouTube','ВК','Telegram','Instagram','Pinterest'];
let st={m:MONTHS.length-1,p:'Все',sort:'v'};
try{const s=JSON.parse(localStorage.getItem('ut-stats')||'{}');if(s.m!=null&&MONTHS[s.m])st.m=s.m;if(s.p)st.p=s.p;}catch(e){}
const fmt=n=>n==null?'—':n.toLocaleString('ru-RU');
function save(){try{localStorage.setItem('ut-stats',JSON.stringify({m:st.m,p:st.p}))}catch(e){}}
function bar(){
 document.getElementById('months').innerHTML=MONTHS.map((m,i)=>`<button class="btn${i==st.m?' on':''}" data-m="${i}">${m.label}</button>`).join('');
 document.getElementById('plats').innerHTML=PLATS.map(p=>`<button class="sm${p==st.p?' on':''}" data-p="${p}">${p}</button>`).join('');
}
function render(){
 bar();const M=MONTHS[st.m];const all=M.items.map(r=>({pl:r[0],d:r[1],id:r[2],f:r[3],t:r[4],v:r[5],i:r[6]}));
 const by={};all.forEach(r=>{(by[r.pl]=by[r.pl]||{n:0,v:0,i:0,best:null});const b=by[r.pl];b.n+=r.pl=='Pinterest'?50:1;b.v+=r.v||0;b.i+=r.i||0;if(!b.best||r.v>b.best.v)b.best=r;});
 const plats=PLATS.slice(1).filter(p=>by[p]).sort((a,b)=>by[b].v-by[a].v);
 const T={n:0,v:0,i:0};plats.forEach(p=>{if(p!='Pinterest')T.n+=by[p].n;T.v+=by[p].v;T.i+=by[p].i;});
 let h=`<div class="note">${M.notes[0]}</div>`;
 h+=`<section><h2>${M.label} <span class="muted">· ${M.period} · <a href="${M.plan}">контент-план месяца</a></span></h2><div class="kpis">
 <div class="kpi"><b>${fmt(T.n)}</b><span>публикаций + ~50 пинов</span></div><div class="kpi"><b>${fmt(T.v)}</b><span>просмотров</span></div><div class="kpi"><b>${fmt(T.i)}</b><span>взаимодействий</span></div></div></section>`;
 h+=`<section><h2>По площадкам</h2><div class="tw"><table><tr><th>Площадка</th><th class="n">Публикаций</th><th class="n">Просмотры</th><th class="n">Взаимодействия</th><th>Больше всего</th></tr>`+
 plats.map(p=>{const b=by[p];return `<tr><td>${p}</td><td class="n">${p=='Pinterest'?'~50':b.n}</td><td class="n">${fmt(b.v)}</td><td class="n">${p=='Pinterest'?'—':fmt(b.i)}</td><td>${p=='Pinterest'?'2 пина в день':b.best.t+', '+fmt(b.best.v)}</td></tr>`}).join('')+
 `<tr class="tot"><td>Итого</td><td class="n">${T.n} + ~50</td><td class="n">${fmt(T.v)}</td><td class="n">${fmt(T.i)}</td><td></td></tr></table></div><p class="muted">${M.extra}</p></section>`;
 let rows=all.filter(r=>st.p=='Все'||r.pl==st.p);
 rows.sort((a,b)=>st.sort=='d'?(a.d.split('.').reverse().join('').localeCompare(b.d.split('.').reverse().join(''))):(b[st.sort]??-1)-(a[st.sort]??-1));
 const ranked=rows.filter(r=>r.pl!='Pinterest'&&r.f!='Сторис').slice().sort((a,b)=>b.v-a.v);const top=new Set(ranked.slice(0,3)),bot=new Set(ranked.slice(-3));
 h+=`<section><h2>Публикации ${st.p=='Все'?'':'· '+st.p} <span class="muted">· ${rows.length} шт. · зелёным 3 с наибольшими просмотрами, красным 3 с наименьшими</span></h2><div class="tw"><table><tr><th data-s="d">Дата</th><th>Площадка</th><th>ID</th><th>Формат</th><th>Публикация</th><th class="n" data-s="v">Просмотры ▾</th><th class="n" data-s="i">Взаим.</th></tr>`+
 rows.map(r=>`<tr class="${top.has(r)?'top3':bot.has(r)?'bot3':''}"><td>${r.d||'—'}</td><td>${r.pl}</td><td>${r.id}</td><td><span class="tag">${r.f}</span></td><td>${r.t}</td><td class="n">${fmt(r.v)}</td><td class="n">${fmt(r.i)}</td></tr>`).join('')+`</table></div><p class="muted">Нажми на «Дата», «Просмотры» или «Взаим.», чтобы отсортировать. Взаимодействия: лайки, реакции, комментарии, репосты. В Instagram даты не указаны, цифры за последние 30 дней из профессиональной панели.</p></section>`;
 h+=`<section><h2>Выводы месяца для следующего плана</h2><ul>${M.notes.slice(1).map(n=>`<li>${n}</li>`).join('')}</ul></section>`;
 document.getElementById('app').innerHTML=h;
}
document.addEventListener('click',e=>{const t=e.target.closest('[data-m],[data-p],[data-s]');if(!t)return;
 if(t.dataset.m!=null)st.m=+t.dataset.m;else if(t.dataset.p)st.p=t.dataset.p;else st.sort=t.dataset.s;save();render();});
