async function loadPlan(url){if(PLAN[url])return PLAN[url];const P={panes:{}};
 try{const h=await fetch(url).then(r=>{if(!r.ok)throw 0;return r.text()});const d=new DOMParser().parseFromString(h,'text/html');
  const css=d.querySelector('style');if(css&&!document.getElementById('plancss')){const el=document.createElement('style');el.id='plancss';el.textContent=css.textContent.replace(/(^|})\s*(\.top|body|main|:root|\.tab|\.wk)[^{]*\{[^}]*\}/g,'$1');document.head.insertBefore(el,document.getElementById('own'));}
  d.querySelectorAll('section.pane').forEach(p=>{const m={};p.querySelectorAll('article').forEach(a=>{const id=a.querySelector('.id')?.textContent.trim();if(id&&!m[id]){a.querySelectorAll('pre[id]').forEach(x=>{x.dataset.cid=x.id;x.removeAttribute('id')});a.querySelectorAll('.box').forEach(x=>x.classList.add('clip'));a.querySelectorAll('button[onclick]').forEach(x=>x.setAttribute('onclick',x.getAttribute('onclick').replace(/cp\('([^']+)',this\)/,"cp('$1',this)")));m[id]=a.innerHTML;}});P.panes[p.dataset.p]=m;});
 }catch(e){}
 return PLAN[url]=P;}
function panesFor(r){if(r.pl=='Telegram')return r.f=='Канал Романа'?['1']:['0'];if(r.pl=='ВК')return r.f=='Пост'?['2']:['4','2'];if(r.pl=='YouTube')return['5'];if(r.pl=='Instagram')return['3'];return[];}
function cardHtml(P,r){for(const p of panesFor(r)){const h=P.panes[p]?.[r.id];if(h)return h;}return '';}
function cp(id,b){const el=document.querySelector(`[data-cid="${id}"]`);if(!el)return;const t=el.innerText;const ok=()=>{b.textContent='Скопировано';b.classList.add('done');setTimeout(()=>{b.textContent='Скопировать';b.classList.remove('done')},1500)};
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok,()=>fb(t,ok))}else fb(t,ok)}
function fb(t,ok){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(e){}a.remove()}
function header(){const M=MONTHS[st.m];const R=rows(M);

}
function sortTools(){return `<div class="seg" role="group">${[['v','По просмотрам'],['i','По взаимодействиям'],['d','По дате']].map(([k,t])=>`<button class="${st.s==k?'on':''}" data-s="${k}">${t}</button>`).join('')}</div>`;}
function fmtTools(rr){const fs=[...new Set(rr.map(r=>r.f))];if(fs.length<2)return '';return `<div class="seg">${['Все',...fs].map(f=>`<button class="${st.f==f?'on':''}" data-f="${esc(f)}">${f=='Все'?'Все форматы':esc(f)}</button>`).join('')}</div>`;}
function mgrCell(x){if(!x)return '<td colspan="4" class="muted">не оформлено</td>';return `<td>${x.link?`<a href="${x.link}" target="_blank">открыть</a>`:'—'}</td><td class="n">${fmt(x.subs)}</td><td class="n">${fmt(x.posts)}</td><td class="n">${fmt(x.views)}${x.note?`<div class="muted">${esc(x.note)}</div>`:''}</td>`;}
function mgrBlock(M){const L=M.managers||[];const done=L.filter(m=>m.ig&&m.tg).length;
 return `<section class="s"><h2>Соцсети менеджеров <span class="muted">· оформлено полностью ${done} из ${L.length}</span></h2><div class="tw"><table>
 <tr><th rowspan="2">Менеджер</th><th colspan="4">Instagram</th><th colspan="4">Telegram</th></tr>
 <tr><th>Ссылка</th><th class="n">Подписчики</th><th class="n">Публикаций</th><th class="n">Просмотры</th><th>Ссылка</th><th class="n">Подписчики</th><th class="n">Публикаций</th><th class="n">Просмотры</th></tr>`+
 L.map(m=>`<tr><td>${esc(m.name)}</td>${mgrCell(m.ig)}${mgrCell(m.tg)}</tr>`).join('')+`</table></div><p class="muted">Смарт-задача: у каждого менеджера Instagram и Telegram, клиент видит, кто с ним общается. Базовое оформление и пара публикаций, не поток контента.</p></section>`;}
function kpis(b,extra){return `<div class="kpis"><div class="kpi"><b>${fmt(b.n)}</b><span>публикаций</span></div><div class="kpi"><b>${fmt(b.v)}</b><span>просмотров</span></div><div class="kpi"><b>${fmt(b.i)}</b><span>взаимодействий</span></div>${extra||''}</div>`;}
function viewAll(M){const R=rows(M);
 const by={};CONTENT.forEach(p=>{const rr=R.filter(r=>r.pl==p);if(rr.length)by[p]=agg(rr);});
 const pls=Object.keys(by).sort((a,b)=>by[b].v-by[a].v);
 const pins=by.Pinterest?.n||0;const T={n:0,v:0,i:0};pls.forEach(p=>{if(p!='Pinterest')T.n+=by[p].n;T.v+=by[p].v;T.i+=by[p].i;});
 let h=`<section class="s"><h2>${M.label} <span class="muted">· ${M.period}</span></h2><div class="kpis"><div class="kpi"><b>${fmt(T.n)}</b><span>публикаций${pins?` + ${pins} пинов`:''}</span></div><div class="kpi"><b>${fmt(T.v)}</b><span>просмотров</span></div><div class="kpi"><b>${fmt(T.i)}</b><span>взаимодействий</span></div></div></section>`;
 h+=`<section class="s"><h2>По площадкам <span class="muted">· нажми на строку, чтобы открыть площадку</span></h2><div class="tw"><table><tr><th>Площадка</th><th class="n">Публикаций</th><th class="n">Просмотры</th><th class="n">Взаимодействия</th><th class="n">Среднее</th><th>Больше всего</th></tr>`+
 pls.map(p=>{const b=by[p];const pin=p=='Pinterest';return `<tr class="go" data-p="${p}"><td><b>${p}</b></td><td class="n">${pin?b.n+' пинов':b.n}</td><td class="n">${fmt(b.v)}</td><td class="n">${fmt(b.i)}</td><td class="n">${pin?'—':fmt(Math.round(b.v/b.n))}</td><td>${pin?'—':esc(b.best.t)+', '+fmt(b.best.v)}</td></tr>`}).join('')+
 `<tr class="tot"><td>Итого</td><td class="n">${T.n}${pins?' + '+pins+' пинов':''}</td><td class="n">${fmt(T.v)}</td><td class="n">${fmt(T.i)}</td><td></td><td></td></tr></table></div>${M.extra?`<p class="muted">${esc(M.extra)}</p>`:''}</section>`;
 const list=sortRows(R.filter(r=>r.pl!='Pinterest'));const byV=list.slice().sort((a,b)=>b.v-a.v);const top=new Set(byV.slice(0,5)),low=new Set(byV.slice(-5));
 h+=`<section class="s"><h2>Все публикации <span class="muted">· ${list.length} · зелёным 5 с наибольшими просмотрами, красным 5 с наименьшими</span></h2><div class="tools">${sortTools()}</div>`+
 list.map((r,k)=>`<div class="li${top.has(r)?' top':low.has(r)?' low':''}"><span class="r">${k+1}</span><span class="d">${r.d||'—'}</span><span class="pl"><span class="tag">${r.pl}</span></span><span>${esc(r.t)} <span class="muted">· ${esc(r.f)}</span></span><span class="v">${fmt(r.v)} <small>просм.</small> · ${fmt(r.i)} <small>взаим.</small></span></div>`).join('')+`</section>`;
 h+=mgrBlock(M);
 if(M.notes?.length)h+=`<section class="s"><h2>Выводы месяца для следующего плана</h2><ul>${M.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul></section>`;
 return h;}
async function viewPlat(M,app){const all=rows(M).filter(r=>r.pl==st.p);
 if(st.p=='Pinterest'){const b=agg(all);return `<section class="s"><h2>Pinterest · ${M.label} <span class="muted">· ${M.period}</span></h2><div class="kpis"><div class="kpi"><b>${fmt(b.n)}</b><span>пинов</span></div><div class="kpi"><b>${fmt(b.v)}</b><span>просмотров</span></div><div class="kpi"><b>${fmt(b.i)}</b><span>взаимодействий</span></div></div><p class="muted">Пины ведутся по отдельному плану Pinterest, 2 в день в 11:00 и 19:30 МСК, 11 досок.</p></section>`;}
 if(st.f!='Все'&&!all.some(r=>r.f==st.f))st.f='Все';
 const rr=sortRows(all.filter(r=>st.f=='Все'||r.f==st.f));const b=agg(rr);const max=Math.max(...rr.map(r=>r.v),1);
 let h=`<section class="s"><h2>${st.p} · ${M.label} <span class="muted">· ${M.period}${st.f!='Все'?' · '+esc(st.f):''}</span></h2>`+
 kpis(b,`<div class="kpi"><b>${fmt(Math.round(b.v/(b.n||1)))}</b><span>просмотров в среднем</span></div><div class="kpi"><b>${pct(b.i,b.v)}</b><span>взаимодействий от просмотров</span></div>`)+
 (st.p=='ВК'&&M.extra?`<p class="muted">${esc(M.extra.split('. Подписчики')[0])}.</p>`:'')+
 `<div class="tools" style="margin-top:12px">${sortTools()}${fmtTools(all)}</div></section>`;
 app.innerHTML=h+'<p class="muted">Загружаю посты…</p>';
 const P=await loadPlan(M.plan);
 h+=rr.map((r,k)=>{const c=cardHtml(P,r);return `<div class="post pub"><div class="pstat"><b>#${k+1}</b><span>${r.d||'—'}</span><span class="tag">${esc(r.f)}</span><span><b>${fmt(r.v)}</b> просм.</span><span><b>${fmt(r.i)}</b> взаим.</span><span class="meter" title="доля от лучшего поста площадки"><i style="width:${Math.round(r.v/max*100)}%"></i></span></div>${c?`<article>${c}</article>`:`<article><header><span class="id">${esc(r.id)}</span> <b>${esc(r.t)}</b></header><div class="meta">Публикации нет в контент-плане, вышла вне плана</div></article>`}</div>`}).join('');
 return h;}
const PANES={YouTube:[['5','']],ВК:[['2','Пост'],['4','Видео / клип']],Telegram:[['0','Канал Антона'],['1','Канал Романа']],Instagram:[['3','']]};
async function viewTemplate(M,app){const one=CONTENT.includes(st.p);
 let h=`<section class="s"><h2>${one?st.p+' · ':''}${M.label} <span class="muted">· ${M.period}</span></h2><div class="kpis"><div class="kpi"><b>—</b><span>публикаций</span></div><div class="kpi"><b>—</b><span>просмотров</span></div><div class="kpi"><b>—</b><span>взаимодействий</span></div></div><p class="muted">Месяц в работе: ниже контент-план, цифры по каждому посту добавим после разбора в конце месяца.</p></section>`;
 if(one&&st.p!='Pinterest'){app.innerHTML=h+'<p class="muted">Загружаю контент-план…</p>';const P=await loadPlan(M.plan);let cards=[];
  (PANES[st.p]||[]).forEach(([pn,lab])=>{Object.entries(P.panes[pn]||{}).forEach(([id,html])=>cards.push({id,lab,html,d:(html.match(/📅\s*<b>(\d\d\.\d\d)/)||[])[1]||''}));});
  cards.sort((a,b)=>dkey(a.d).localeCompare(dkey(b.d)));
  if(!cards.length)return h+`<section class="s"><div class="empty">Контент-план ${st.p} на этот месяц ещё не готов. Как только он будет, посты появятся здесь целиком: текст, фото, видео.</div></section>`;
  return h+cards.map((c,k)=>`<div class="post"><div class="pstat"><b>#${k+1}</b><span>план: ${c.d||'—'}</span>${c.lab?`<span class="tag">${c.lab}</span>`:''}<span>просмотры и взаимодействия — после публикации</span></div><article>${c.html}</article></div>`).join('');}
 if(one)return h;
 return h+`<section class="s"><h2>По площадкам</h2><div class="tw"><table><tr><th>Площадка</th><th class="n">Публикаций</th><th class="n">Просмотры</th><th class="n">Взаимодействия</th><th class="n">Среднее</th><th>Больше всего</th></tr>${CONTENT.map(p=>`<tr><td><b>${p}</b></td><td class="n">—</td><td class="n">—</td><td class="n">—</td><td class="n">—</td><td>—</td></tr>`).join('')}<tr class="tot"><td>Итого</td><td class="n">—</td><td class="n">—</td><td class="n">—</td><td></td><td></td></tr></table></div></section>`+mgrBlock(M);}
let seq=0;
async function render(){const my=++seq;writeHash();header();const M=MONTHS[st.m];const app=document.getElementById('app');let h;
 if(st.p=='Менеджеры')h=mgrBlock(M);else if(M.template)h=await viewTemplate(M,app);else if(st.p=='Все')h=viewAll(M);else h=await viewPlat(M,app);
 if(my!=seq)return;app.innerHTML=h;
 app.querySelectorAll('.post .box.clip').forEach(bx=>{const pre=bx.querySelector('pre');if(!pre||pre.scrollHeight<=pre.clientHeight+4){bx.classList.remove('clip');return;}const btn=document.createElement('button');btn.className='more';btn.textContent='Показать текст полностью';btn.onclick=()=>{bx.classList.toggle('clip');btn.textContent=bx.classList.contains('clip')?'Показать текст полностью':'Свернуть текст';};bx.after(btn);});}
document.addEventListener('click',e=>{const t=e.target.closest('[data-m],[data-p],[data-s],[data-f]');if(!t)return;e.preventDefault();
 const sc=t.dataset.m!=null||t.dataset.p!=null;
 if(t.dataset.m!=null)st.m=+t.dataset.m;if(t.dataset.p!=null){st.p=t.dataset.p;st.f='Все';}if(t.dataset.s)st.s=t.dataset.s;if(t.dataset.f)st.f=t.dataset.f;
 render();if(sc)scrollTo(0,0);});
readHash();render();
</script></body></html>
