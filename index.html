mpins:{"Александр Казанцев": "Привет! Я Александр Казанцев, менеджер проектов UNITRAMP.\n\nПомогаю собственникам торговых центров и инвесторам открыть детский или семейный парк: от замеров помещения до первого гостя.\n\nЧто здесь будет:\n▪️ проекты, которые я веду: города, площади, фото с монтажа\n▪️ ответы на частые вопросы: сроки, помещение, документы\n▪️ новости с производства и тестовых сборок\n\nХотите понять, что можно сделать в вашем помещении? Напишите мне в личные сообщения.", "Екатерина Тюкавкина": "Привет! Я Екатерина, менеджер проектов UNITRAMP.\n\nОбъездила десятки детских парков в России и за её пределами и рассказываю, что в них работает: зоны, которые держат гостей часами, детали, на которых парк зарабатывает.\n\nЧто здесь будет:\n▪️ обзоры парков: что взять в свой проект\n▪️ проекты, которые я веду\n▪️ ответы на вопросы собственников\n\nОбсудить ваш парк: напишите мне в личные сообщения.", "Оксана Журман": "Здравствуйте! Я Оксана, менеджер проектов UNITRAMP.\n\nВеду проекты детских и семейных парков от первого звонка до открытия: помещение, концепция, производство, монтаж.\n\nЧто здесь будет:\n▪️ проекты, которые я веду\n▪️ ответы на вопросы собственников\n▪️ как устроен путь парка от идеи до открытия\n\nНапишите мне, если хотите обсудить ваше помещение.", "Кирилл Шувалов": "Я Кирилл Шувалов, генеральный директор UNITRAMP.\n\nВ индустрии развлечений с 2019 года: прошёл путь от менеджера по продажам до директора, открывал парки в странах СНГ, работал с проектами в Нью-Йорке и Германии.\n\nС заказчиками работаю по трём правилам: окупаемость, безопасность, эффектно.\n\nЗдесь пишу о том, как создаются прибыльные семейные парки, и показываю проекты UNITRAMP."},

  const css=d.querySelector('style');if(css&&!document.getElementById('plancss')){const el=document.createElement('style');el.id='plancss';el.textContent=css.textContent.replace(/(^|})\s*(\.top|body|main|:root|\.tab|\.wk)[^{]*\{[^}]*\}/g,'$1');document.head.insertBefore(el,document.getElementById('own'));}
  d.querySelectorAll('section.pane').forEach(p=>{const m={};const who=p.dataset.who?p.dataset.who+'|'+(p.dataset.net||'tg'):null;if(who){P.who=P.who||{};P.who[who]=[...p.querySelectorAll('article')].map(a=>({d:(a.querySelector('.when')?.textContent.match(/(\d\d\.\d\d)/)||[])[1]||'',html:a.innerHTML}));}p.querySelectorAll('article').forEach(a=>{const id=a.querySelector('.id')?.textContent.trim();if(id&&!m[id]){a.querySelectorAll('pre[id]').forEach(x=>{x.dataset.cid=x.id;x.removeAttribute('id')});a.querySelectorAll('.box').forEach(x=>x.classList.add('clip'));a.querySelectorAll('button[onclick]').forEach(x=>x.setAttribute('onclick',x.getAttribute('onclick').replace(/cp\('([^']+)',this\)/,"cp('$1',this)")));m[id]=a.innerHTML;}});P.panes[p.dataset.p]=m;});
 }catch(e){}

function panesFor(r){if(r.pl=='Telegram')return r.f=='Канал Романа'?['1']:['0'];if(r.pl=='ВК')return r.f=='Пост'?['2']:['4','2'];if(r.pl=='YouTube')return['5'];if(r.pl=='Instagram')return['3'];return[];}
